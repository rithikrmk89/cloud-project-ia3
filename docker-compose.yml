services:
  nearbee-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: nearbee-cloud-app:latest
    container_name: nearbee_web_service
    restart: unless-stopped
    ports:
      - "10000:10000"
    environment:
      - NODE_ENV=production
      - PORT=10000
      - HOST=0.0.0.0
      - SUPABASE_PROJECT_ID=${SUPABASE_PROJECT_ID:-ojfosxqlobynhjlnooro}
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9qZm9zeHFsb2J5bmhqbG5vb3JvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwMjA3OTksImV4cCI6MjA5NzU5Njc5OX0.KbRIrzvZT6DNXFYHrNHFtQ_tiBxy3SB4mMb4NvbjWYg}
      - SUPABASE_URL=${SUPABASE_URL:-https://ojfosxqlobynhjlnooro.supabase.co}
      - VITE_SUPABASE_PROJECT_ID=${VITE_SUPABASE_PROJECT_ID:-ojfosxqlobynhjlnooro}
      - VITE_SUPABASE_PUBLISHABLE_KEY=${VITE_SUPABASE_PUBLISHABLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9qZm9zeHFsb2J5bmhqbG5vb3JvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwMjA3OTksImV4cCI6MjA5NzU5Njc5OX0.KbRIrzvZT6DNXFYHrNHFtQ_tiBxy3SB4mMb4NvbjWYg}
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-https://ojfosxqlobynhjlnooro.supabase.co}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:10000/"]
      interval: 30s
      timeout: 5s
      retries: 3

