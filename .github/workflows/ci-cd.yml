name: NearBee Cloud CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  validate-and-test:
    name: Code Quality & Unit Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: TypeScript Compile Check
        run: npx tsc --noEmit || true

      - name: Production Build Test (Nitro Node Server)
        env:
          NITRO_PRESET: node-server
        run: npm run build

  docker-build:
    name: Build & Verify Docker Image
    needs: validate-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: nearbee-app:test

  deploy-to-render:
    name: Deploy to Render Cloud
    needs: [validate-and-test, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deployment via Webhook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Triggering Render Cloud deployment..."
            curl -X POST "$RENDER_DEPLOY_HOOK_URL"
            echo "Render deployment trigger sent successfully."
          else
            echo "RENDER_DEPLOY_HOOK_URL secret not configured; skipping trigger step."
          fi

